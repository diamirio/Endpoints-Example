name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_26.0.0.app/Contents/Developer

    - name: Build and Test
      run: |
        xcodebuild test \
          -project EndpointsExample.xcodeproj \
          -scheme EndpointsExample \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
          -enableCodeCoverage YES \
          | xcpretty && exit ${PIPESTATUS[0]}
